# One-command stack: Ollama + NativeMind.
#   docker compose up
# Then open http://localhost:3000
#
# Pull a model into the bundled Ollama once it's up:
#   docker compose exec ollama ollama pull llama3.2

services:
  ollama:
    image: ollama/ollama:latest
    container_name: nativemind-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    # Uncomment to give Ollama access to an NVIDIA GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  nativemind:
    build: .
    container_name: nativemind-app
    ports:
      - "3000:3000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - NATIVEMIND_DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama:
